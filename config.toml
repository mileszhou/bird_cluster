# Non-secret, checked-in project configuration. Secrets (API keys) stay in .env
# (gitignored); machine-specific values go in config.local.toml (also gitignored,
# copy _config.local.toml), which is layered over this file.
#
# Everything here must be a value that works for a stranger, because this file is
# tracked: anything you change to suit your own machines dirties your tree for as
# long as your setup is right. The server hosts below say localhost for that
# reason -- they used to name the author's own boxes.

# Which run directory the analysis tools work on by default. Runs get renamed —
# ./clean archives output/ to output_NNN_<description>/ — so the post-processors
# must be told where to look rather than assuming ./output. Point this at an
# archive to re-analyse it, and every tool follows without a flag.
current_working_output = "./output"

# The dataset is deliberately NOT configured here. This file is tracked, so a
# local edit to it would show as a dirty tree for as long as you keep it. Point
# the tools at your own library by copying `_datapath` to `.datapath`, which is
# gitignored, or set $BIRD_DATA_DIR for a one-off. See `_datapath`.

# Override any of these in config.local.toml -- host alone is enough, the port
# is inherited. --vllm-url / --embed-url still win for a single run.

# Which model a backend asks for. Only the cloud backends appear here: `vllm`
# and `llama.cpp` probe their server and record whatever it actually serves, and
# a name configured here would be a second, unchecked source of that same fact.
# `openai` has no server to probe, so its model has to be stated somewhere --
# and in config rather than in code, because the answer changes as models are
# retired. Override in config.local.toml, or per run with --model.
[models]
openai = "gpt-4o"

[servers.vllm]
host = "localhost"
port = 8000

[servers.embed]
host = "localhost"
port = 9100

[servers.llama_cpp]
host = "localhost"
port = 8080
